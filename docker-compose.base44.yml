# Base44 sandbox environment for THE DAILY EDITION.
#
# This file is the executable runbook for local/sandbox development: it runs the
# application from the cloned source with a live-reload dev server, so edits are
# reflected in the preview without rebuilding an image.
#
# The application is a single Vite + React single-page app with no server-side
# component and no database, so one service is sufficient.
#
#   docker compose -f docker-compose.base44.yml up -d --build

name: the-daily-edition

services:
  web:
    # Plain runtime image — never the project's own published image — so the
    # bind-mounted source below is what actually runs.
    image: node:22-bookworm-slim
    working_dir: /app
    # Dependencies live in a named volume, so they are installed on startup from
    # the current lockfile rather than baked into an image.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      # The user-facing entry point must be on host port 3000.
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # BASE44_* values are supplied by the platform; pass them through so the
      # dev server can accept the rotating preview hostname. Never hardcode them.
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      # Vite >= 6.1 appends this to server.allowedHosts when present.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind-mounted source does not emit inotify events inside the container.
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
