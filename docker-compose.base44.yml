# Base44 sandbox environment for the Voltaro e-bike shop.
#
# Runs the Vite dev server from the cloned source (bind-mounted) on a plain
# Node base image so edits are reflected live — never a prebuilt app image.
services:
  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        if [ -f package-lock.json ]; then
          npm ci --no-audit --no-fund
        else
          npm install --no-audit --no-fund
        fi
        exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      # Passed through from the platform. Vite reads
      # __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS (>= 6.1) and vite.config.ts adds
      # the sandbox host wildcard when BASE44_PREVIEW_MODE === "1".
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts on Linux VMs often miss inotify events — poll instead.
      - CHOKIDAR_USEPOLLING=true
    restart: on-failure
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
